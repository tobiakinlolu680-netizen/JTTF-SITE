@keyframes shine{to{background-position:200%}}

.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:0 0 18px}

main{max-width:900px;margin:0 auto;padding:18px 14px 60px}

.card.in{opacity:1;transform:none}

.mut{color:var(--mut)}.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#111}

.step:first-of-type{border-top:0}.step b.n{flex:none;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#111;border-radius:8px;padding:2px 8px;font-size:13px;min-width:34px;text-align:center}

ul{padding-left:20px;margin:8px 0}
label{display:block;font-weight:600;margin:14px 0 4px}

.btn{margin-top:16px;border:0;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#111;font:700 16px system-ui,sans-serif;padding:12px 22px;border-radius:99px;cursor:pointer;transition:.2s;box-shadow:0 4px 18px var(--glow)}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.35)}
.res{border-top:1px solid var(--line);padding:10px 0}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips button{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:99px;cursor:pointer;font:600 13px system-ui,sans-serif}.chips button.on{background:var(--ac);color:#111;border-color:var(--ac)}

#lb.on{display:flex}#lb img{max-width:100%;max-height:78vh;border-radius:12px}#lb p{color:#fff;margin:10px 0}

.lbn{display:flex;gap:12px}.lbn button{position:static}

#gate{position:fixed;inset:0;z-index:100;background:radial-gradient(600px 400px at 50% 0,rgba(255,184,31,.25),var(--bg));display:flex;align-items:center;justify-content:center;padding:20px}#gate:not(.on){display:none}.gbox{max-width:420px;width:100%;text-align:center;background:var(--card);border:1px solid var(--ac);border-radius:20px;padding:26px;box-shadow:0 0 50px var(--glow)}.arena{background:linear-gradient(180deg,#1a2a4a 0%,#2b1a3d 60%,#1b1320 100%);border-radius:16px;margin-bottom:12px;min-height:250px;color:#fff}.arena:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(#3a2a1c,#241810)}.boss{font-size:110px;filter:drop-shadow(0 0 22px rgba(255,184,31,.7));animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}.boss.mega{font-size:130px;filter:drop-shadow(0 0 30px #ff2d2d)}.boss.hit{animation:hit .25s}#fb{font-size:22px;padding:16px 40px;animation:pulse 1.6s infinite}@keyframes pulse{50%{transform:scale(1.06)}}.arena .mut{color:#cfd8ea}
.dc{background:#313338;border-radius:12px;overflow:hidden;color:#dbdee1;margin-bottom:14px}.dch{padding:12px 16px;border-bottom:1px solid #1e1f22;font-weight:700}.dm{display:flex;gap:12px;padding:14px 16px}.dm:hover{background:#2e3035}.av{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ffb81f,#ff5e3a);color:#111;font-weight:800;display:flex;align-items:center;justify-content:center}.dn{color:#f2c94c}.dt{white-space:pre-wrap;margin-top:2px;word-break:break-word}.dc .mut{color:#949ba4;font-size:12px}textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.slides{position:fixed;inset:0;z-index:-2}header{background:none}body:before{background:linear-gradient(color-mix(in srgb,var(--bg) 80%,transparent),color-mix(in srgb,var(--bg) 90%,transparent)),radial-gradient(600px 400px at 10% 10%,rgba(255,94,58,.18),transparent),radial-gradient(700px 500px at 90% 30%,rgba(61,165,255,.16),transparent)!important}
nav{display:block!important;padding:8px 10px!important}.bar{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;padding:2px 2px}#mt{border-radius:99px!important}
.mg{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.mg.open{display:grid;animation:drop .25s}@keyframes drop{from{opacity:0;transform:translateY(-10px)}}

.ring:after{content:"";position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:#ff3b5c;animation:blip 1.2s infinite}@keyframes blip{50%{transform:scale(1.7);opacity:.4}}
.btn{position:relative;overflow:hidden}.btn:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:sweep 3.2s infinite}@keyframes sweep{to{left:140%}}.btn:active{transform:scale(.94)}
.tag.rk{background:var(--st);color:#fff;font-size:11px}.av{animation:pulse 3s infinite}
